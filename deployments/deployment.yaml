apiVersion: apps/v1
kind: Deployment
metadata:
  name: nexus-data-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nexus-data-platform
  template:
    metadata:
      labels:
        app: nexus-data-platform
    spec:
      containers:
        - name: nexus-api
          image: nexus-data-platform:latest
          ports:
            - containerPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: nexus-data-platform-service
spec:
  selector:
    app: nexus-data-platform
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8000
  type: ClusterIP
